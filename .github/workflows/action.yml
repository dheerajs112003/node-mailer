
name: 'node-mailer test'
on:
 push:
   branches: [main]
 pull_request:
   branches: [main]

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
        - name: check out the code
          uses: actions/checkout@v4
          
        - name: install pnpm
          uses: pnpm/action-setup@v6
          with:
            version: 10
            cache: true

        - name: check node mailer version
          uses: actions/setup-node@v6
          with: 
            node-version: '>22'
            cache: 'pnpm'
        - run: 'pnpm install -P'
        - run: 'pnpm build'
        - run: 'pnpm list'
      