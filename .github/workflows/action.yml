
name: 'node-mailer test'
on:
 push:
   branches: [main]
 pull_request:
   branches: [main]

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
        - name: check out the code
          uses: actions/checkout@v4
          
        - name: install pnpm
          uses: pnpm/action-setup@v6
          with:
            version: 10
        
        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Build project
          run: pnpm build
        - name: List Packages
          run: pnpm list
      